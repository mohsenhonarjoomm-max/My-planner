<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>پلنر</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="پلنر">
<meta name="theme-color" content="#2f4a3a">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20261f;
    --paper:#f6f3ea;
    --paper-2:#eee8d8;
    --forest:#2f4a3a;
    --forest-deep:#1c2f24;
    --gold:#b8863a;
    --gold-soft:#e3c690;
    --line: rgba(32,38,31,0.14);
    --red:#a8503f;
    --past:#a49d8f;
    --past-bg:#e6e1d3;
    --today-bg:#2f4a3a;
    --future-bg:#e0b23c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--paper);
    font-family:'Vazirmatn', sans-serif;
    color: var(--ink);
    min-height:100vh;
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom)); }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .icon-btn{
    display:flex; align-items:center; gap:4px;
    background:none; border:none;
    color:var(--forest-deep); font-weight:700; font-size:13px;
    font-family:'Vazirmatn',sans-serif;
    cursor:pointer; padding:6px 4px;
    opacity:1;
  }
  .icon-btn[disabled]{ opacity:0.3; cursor:default; }
  .pill-btn{
    background: var(--paper-2);
    border:1px solid var(--line);
    color: var(--forest-deep);
    font-weight:700; font-size:12px;
    font-family:'Vazirmatn',sans-serif;
    border-radius:20px;
    padding:7px 14px;
    cursor:pointer;
  }

  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .nav-btn{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line); background: var(--paper-2);
    color:var(--forest-deep); font-size:17px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .nav-btn:active{ transform: scale(0.92); }
  .title-block{ text-align:center; flex:1; }
  .title-main{ font-size:20px; font-weight:800; color:var(--forest-deep); }
  .title-sub{ font-size:11px; color:var(--gold); font-weight:600; margin-top:2px; letter-spacing:.5px; }

  .legend{
    display:flex; gap:14px; justify-content:center;
    font-size:10.5px; color:var(--forest-deep); opacity:0.75;
    margin-bottom:14px;
  }
  .legend span{ display:flex; align-items:center; gap:4px; }
  .dotleg{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* MONTH VIEW */
  .weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .weekdays div{ text-align:center; font-size:11px; font-weight:700; color:var(--forest); opacity:0.7; padding-bottom:6px; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .day{
    position:relative; aspect-ratio:1/1; border-radius:12px;
    border:1px solid var(--line); padding:6px; cursor:pointer;
    display:flex; flex-direction:column; justify-content:flex-start;
    background: var(--past-bg); color: var(--ink);
  }
  .day.empty{ background:transparent; border:none; cursor:default; }
  .day.status-today{ background: var(--today-bg); color:var(--paper); }
  .day.status-future{ background: var(--future-bg); color:var(--forest-deep); }
  .day.status-past{ background: var(--past-bg); color:var(--ink); opacity:0.85; }
  .day .num{ font-size:13px; font-weight:700; }
  .day .frac{ font-size:9px; font-weight:700; position:absolute; bottom:6px; right:7px; opacity:0.85; }
  .day .exp-dot{ width:5px; height:5px; border-radius:50%; background:var(--red); position:absolute; bottom:6px; left:7px; }
  .month-total{
    margin-top:16px; background:var(--paper-2); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; text-align:center;
    font-size:14px; font-weight:700; color:var(--forest-deep);
  }

  /* WEEK VIEW */
  .week-row{
    display:flex; align-items:center; gap:12px;
    background:var(--past-bg); border:1px solid var(--line);
    border-radius:12px; padding:12px; margin-bottom:8px; cursor:pointer;
  }
  .week-row.status-today{ background: var(--today-bg); color:var(--paper); }
  .week-row.status-future{ background: var(--future-bg); color:var(--forest-deep); }
  .week-row.status-past{ background: var(--past-bg); color:var(--ink); opacity:0.85; }
  .week-row .wd-name{ font-size:13px; font-weight:700; width:60px; }
  .week-row .wd-num{ font-size:18px; font-weight:800; width:26px; }
  .week-row .wd-stats{ flex:1; font-size:11px; opacity:0.85; text-align:left; }

  /* DAY VIEW */
  .day-status-banner{
    text-align:center; font-size:12px; font-weight:700;
    border-radius:10px; padding:8px; margin-bottom:14px;
  }
  .day-status-banner.status-today{ background:var(--today-bg); color:var(--paper); }
  .day-status-banner.status-future{ background:var(--future-bg); color:var(--forest-deep); }
  .day-status-banner.status-past{ background:var(--past-bg); color:var(--ink); }

  .section{ margin-bottom:22px; }
  .section-title{ font-size:14px; font-weight:800; color:var(--forest-deep); margin-bottom:8px; }

  .task-row{
    display:flex; align-items:center; gap:8px;
    padding:9px 4px; border-bottom:1px solid var(--line);
  }
  .task-row:last-child{ border-bottom:none; }
  .task-check{
    width:22px; height:22px; border-radius:7px; border:2px solid var(--gold);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:transparent; font-size:13px; color:var(--paper);
  }
  .task-check.checked{ background:var(--gold); }
  .task-label{ flex:1; font-size:14px; cursor:pointer; }
  .task-reminder{
    border:1px solid var(--line); border-radius:8px; background:var(--paper-2);
    font-family:'Vazirmatn',sans-serif; font-size:11px; padding:4px 6px; width:78px; color:var(--ink);
  }
  .task-remove{ background:none; border:none; color:var(--red); font-size:14px; cursor:pointer; opacity:0.5; padding:2px; }
  .add-row{ display:flex; gap:8px; margin-top:10px; }
  .add-row input{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper-2); font-family:'Vazirmatn',sans-serif; font-size:13px; color:var(--ink); outline:none;
  }
  .add-row input:focus{ border-color:var(--gold); }
  .add-btn{
    background:var(--forest); color:var(--paper); border:none; border-radius:10px;
    padding:0 16px; font-weight:700; font-size:18px; cursor:pointer;
  }
  .empty-note{ text-align:center; padding:14px 0; color:var(--forest); opacity:0.5; font-size:12px; }

  .expense-row{
    display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--line);
  }
  .expense-row:last-child{ border-bottom:none; }
  .expense-desc{ flex:1; font-size:13px; }
  .expense-amt{ font-size:13px; font-weight:700; color:var(--forest-deep); white-space:nowrap; }
  .expense-remove{ background:none; border:none; color:var(--red); font-size:14px; cursor:pointer; opacity:0.5; }
  .add-expense-row{ display:flex; gap:6px; margin-top:10px; }
  .add-expense-row input{
    padding:10px 10px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper-2); font-family:'Vazirmatn',sans-serif; font-size:13px; color:var(--ink); outline:none;
  }
  .add-expense-row input.desc{ flex:1; }
  .add-expense-row input.amt{ width:100px; }
  .day-sum{
    margin-top:10px; text-align:left; font-size:13px; font-weight:800; color:var(--forest-deep);
  }

  .note-area{
    width:100%; min-height:110px; border-radius:12px; border:1px solid var(--line);
    background:var(--paper-2); padding:12px; font-family:'Vazirmatn',sans-serif;
    font-size:13.5px; color:var(--ink); resize:vertical; outline:none;
  }
  .note-area:focus{ border-color:var(--gold); }
  .save-btn-top{
    display:flex; align-items:center; gap:5px;
    background: var(--forest); color:var(--paper); border:none;
    border-radius:20px; padding:7px 14px; font-weight:700; font-size:12px;
    font-family:'Vazirmatn',sans-serif; cursor:pointer;
  }

  .reminder-note{
    font-size:11px; color:var(--forest); opacity:0.65; margin-top:6px; line-height:1.6;
  }
  .notif-btn{
    background:var(--paper-2); border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; font-size:12px; font-weight:700; color:var(--forest-deep);
    cursor:pointer; margin-bottom:10px;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--forest-deep); color:var(--paper); padding:12px 18px;
    border-radius:12px; font-size:13px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,0.25);
    z-index:100; display:none;
  }
  .toast.show{ display:block; }
  .loading{ text-align:center; padding:40px; color:var(--forest); opacity:0.6; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="icon-btn" id="backBtn">بازگشت ‹‹</button>
    <div style="display:flex; gap:8px;">
      <button class="pill-btn" id="todayBtn">امروز</button>
      <button class="save-btn-top" id="saveBtn">💾 ذخیره</button>
    </div>
  </div>
  <div class="titlebar">
    <button class="nav-btn" id="nextBtn">‹</button>
    <div class="title-block">
      <div class="title-main" id="titleMain"></div>
      <div class="title-sub" id="titleSub"></div>
    </div>
    <button class="nav-btn" id="prevBtn">›</button>
  </div>
  <div class="legend">
    <span><i class="dotleg" style="background:var(--past-bg);border:1px solid var(--line)"></i>گذشته</span>
    <span><i class="dotleg" style="background:var(--today-bg)"></i>امروز</span>
    <span><i class="dotleg" style="background:var(--future-bg)"></i>در انتظار</span>
  </div>
  <div id="content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Jalali conversion (Birashk algorithm) ---------- */
function div(a,b){ return Math.floor(a/b); }
function gregorianToJalali(gy, gm, gd) {
  var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  var jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = (365*gy) + div(gy2+3,4) - div(gy2+99,100) + div(gy2+399,400) - 80 + gd + g_d_m[gm-1];
  jy += 33 * div(days,12053); days %= 12053;
  jy += 4 * div(days,1461); days %= 1461;
  if (days > 365) { jy += div(days-1,365); days = (days-1) % 365; }
  var jm, jd;
  if (days < 186) { jm = 1 + div(days,31); jd = 1 + (days % 31); }
  else { jm = 7 + div(days-186,30); jd = 1 + ((days-186) % 30); }
  return [jy, jm, jd];
}
function jalaliToGregorian(jy, jm, jd) {
  var gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  var days = (365*jy) + (div(jy,33)*8) + div(((jy%33)+3),4) + 78 + jd + ((jm < 7) ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400 * div(days,146097); days %= 146097;
  if (days > 36524) { days--; gy += 100 * div(days,36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * div(days,1461); days %= 1461;
  if (days > 365) { gy += div(days-1,365); days = (days-1) % 365; }
  var gd = days + 1;
  var isLeapG = ((gy%4===0)&&(gy%100!==0))||(gy%400===0);
  var sal_a = [0,31,isLeapG?29:28,31,30,31,30,31,31,30,31,30,31];
  var gm;
  for (gm=1; gm<=12; gm++) { var v = sal_a[gm]; if (gd <= v) break; gd -= v; }
  return [gy, gm, gd];
}
function isLeapJalaliYear(jy){ return (25*jy + 11) % 33 < 8; }
function jDaysInMonth(jy, jm){
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalaliYear(jy) ? 30 : 29;
}
function addDaysJalali(jy,jm,jd,delta){
  const [gy,gm,gd] = jalaliToGregorian(jy,jm,jd);
  const d = new Date(gy, gm-1, gd);
  d.setDate(d.getDate()+delta);
  return gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
}
function weekdayShift(jy,jm,jd){
  const [gy,gm,gd] = jalaliToGregorian(jy,jm,jd);
  const dow = new Date(gy,gm-1,gd).getDay(); // 0=Sun..6=Sat
  return (dow + 1) % 7; // 0=Sat
}
function dateStatus(jy,jm,jd){
  const [gy,gm,gd] = jalaliToGregorian(jy,jm,jd);
  const d = new Date(gy,gm-1,gd).getTime();
  const t = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
  if(d < t) return 'past';
  if(d === t) return 'today';
  return 'future';
}

const jMonthNames = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const jWeekdayNames = ["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];

/* ---------- Local device storage (works standalone, no internet needed) ---------- */
const LS_PREFIX = 'fa_planner_';
function lsGet(key){
  try{ return localStorage.getItem(LS_PREFIX+key); }catch(e){ return null; }
}
function lsSet(key,val){
  try{ localStorage.setItem(LS_PREFIX+key, val); return true; }catch(e){ console.error('storage failed', e); return false; }
}
let today = new Date();
let [tJy, tJm, tJd] = gregorianToJalali(today.getFullYear(), today.getMonth()+1, today.getDate());

let view = 'day'; // 'day' | 'week' | 'month'
let anchor = { jy: tJy, jm: tJm, jd: tJd };

let taskList = [];
let dayDataCache = {};
let firedReminders = new Set();

function dayCacheKey(jy,jm,jd){ return `${jy}-${jm}-${jd}`; }
function storageKey(jy,jm,jd){ return `day:${jy}-${String(jm).padStart(2,'0')}-${String(jd).padStart(2,'0')}`; }

function emptyDayData(){ return { done: [], expenses: [], reminders: {}, note: '' }; }

function fetchDay(jy,jm,jd){
  const ck = dayCacheKey(jy,jm,jd);
  if(dayDataCache[ck]) return dayDataCache[ck];
  let data = emptyDayData();
  const raw = lsGet(storageKey(jy,jm,jd));
  if(raw){ try{ data = Object.assign(emptyDayData(), JSON.parse(raw)); }catch(e){} }
  dayDataCache[ck] = data;
  return data;
}
function saveDay(jy,jm,jd,data){
  dayDataCache[dayCacheKey(jy,jm,jd)] = data;
  lsSet(storageKey(jy,jm,jd), JSON.stringify(data));
}

function loadTasks(){
  const raw = lsGet('tasks');
  taskList = raw ? JSON.parse(raw) : null;
  if(!taskList){
    taskList = ["آموزش زبان", "پیاده‌روی", "آموزش AI"];
    lsSet('tasks', JSON.stringify(taskList));
  }
}
function saveTasks(){ lsSet('tasks', JSON.stringify(taskList)); }

function fmtAmount(n){ return Number(n||0).toLocaleString('fa-IR', { maximumFractionDigits: 2 }); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 4000);
}

/* ---------- Reminder checker ---------- */
async function checkReminders(){
  const data = await fetchDay(tJy,tJm,tJd);
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const nowStr = `${hh}:${mm}`;
  Object.entries(data.reminders||{}).forEach(([task,time])=>{
    if(time === nowStr){
      const fireKey = `${tJy}-${tJm}-${tJd}-${task}-${time}`;
      if(!firedReminders.has(fireKey)){
        firedReminders.add(fireKey);
        showToast(`⏰ یادآوری: ${task}`);
        if("Notification" in window && Notification.permission === 'granted'){
          try{ new Notification('یادآوری پلنر', { body: task }); }catch(e){}
        }
      }
    }
  });
}
setInterval(checkReminders, 20000);

/* ---------- Navigation ---------- */
function setView(v, a){
  view = v;
  if(a) anchor = a;
  renderAll();
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  if(view === 'day') setView('week', anchor);
  else if(view === 'week') setView('month', anchor);
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  setView('day', { jy: tJy, jm: tJm, jd: tJd });
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(view === 'day'){ anchor = Object.assign({}, {jy:anchor.jy,jm:anchor.jm,jd:anchor.jd}); const n = addDaysJalali(anchor.jy,anchor.jm,anchor.jd,1); anchor={jy:n[0],jm:n[1],jd:n[2]}; }
  else if(view === 'week'){ const n = addDaysJalali(anchor.jy,anchor.jm,anchor.jd,7); anchor={jy:n[0],jm:n[1],jd:n[2]}; }
  else{ anchor.jm++; if(anchor.jm>12){anchor.jm=1; anchor.jy++;} anchor.jd = Math.min(anchor.jd, jDaysInMonth(anchor.jy,anchor.jm)); }
  renderAll();
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(view === 'day'){ const n = addDaysJalali(anchor.jy,anchor.jm,anchor.jd,-1); anchor={jy:n[0],jm:n[1],jd:n[2]}; }
  else if(view === 'week'){ const n = addDaysJalali(anchor.jy,anchor.jm,anchor.jd,-7); anchor={jy:n[0],jm:n[1],jd:n[2]}; }
  else{ anchor.jm--; if(anchor.jm<1){anchor.jm=12; anchor.jy--;} anchor.jd = Math.min(anchor.jd, jDaysInMonth(anchor.jy,anchor.jm)); }
  renderAll();
});

/* ---------- Render dispatch ---------- */
async function renderAll(){
  document.getElementById('backBtn').disabled = (view === 'month');
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">در حال بارگذاری...</div>';
  if(view === 'day') await renderDayView();
  else if(view === 'week') await renderWeekView();
  else await renderMonthView();
}

/* ---------- DAY VIEW ---------- */
async function renderDayView(){
  const {jy,jm,jd} = anchor;
  const status = dateStatus(jy,jm,jd);
  const [gy,gm,gd] = jalaliToGregorian(jy,jm,jd);
  const shift = weekdayShift(jy,jm,jd);
  const wd = jWeekdayNames[shift];

  document.getElementById('titleMain').textContent = `${wd} ${jd} ${jMonthNames[jm-1]}`;
  document.getElementById('titleSub').textContent = `${jy}`;

  const data = await fetchDay(jy,jm,jd);

  const statusLabel = status==='past' ? 'این روز گذشته' : status==='today' ? 'امروز' : 'در انتظار این روز';
  let html = `<div class="day-status-banner status-${status}">${statusLabel}</div>`;

  // Note
  html += `<div class="section"><div class="section-title">یادداشت</div>
    <textarea class="note-area" id="noteArea" placeholder="هر چیزی که می‌خوای برای این روز یادت بمونه...">${(data.note||'').replace(/</g,'&lt;')}</textarea>
  </div>`;

  // Tasks
  html += `<div class="section"><div class="section-title">کارهای روزانه</div><div id="taskListBox">`;
  if(!taskList.length){
    html += `<div class="empty-note">هنوز کاری اضافه نکردی</div>`;
  } else {
    taskList.forEach(task=>{
      const checked = data.done.includes(task);
      const reminder = data.reminders[task] || '';
      html += `
        <div class="task-row">
          <div class="task-check ${checked?'checked':''}" data-task="${encodeURIComponent(task)}" data-act="toggle">${checked?'✓':''}</div>
          <div class="task-label" data-task="${encodeURIComponent(task)}" data-act="toggle">${task}</div>
          <input type="time" class="task-reminder" data-task="${encodeURIComponent(task)}" value="${reminder}">
          <button class="task-remove" data-task="${encodeURIComponent(task)}" data-act="remove">✕</button>
        </div>`;
    });
  }
  html += `</div>
    <div class="add-row">
      <input type="text" id="newTaskInput" placeholder="کار جدید، مثلاً: آموزش زبان">
      <button class="add-btn" id="addTaskBtn">+</button>
    </div>
    <button class="notif-btn" id="notifBtn">🔔 فعال‌سازی اعلان یادآور</button>
    <div class="reminder-note">یادآورها وقتی کار می‌کنند که این صفحه در مرورگر باز باشد؛ برای یادآوری مطمئن حتی وقتی صفحه بسته است، کافیه همینجا از من بخوای در اپ Reminders گوشی‌ات هم ثبتش کنم.</div>
  </div>`;

  // Expenses
  const sum = data.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  html += `<div class="section"><div class="section-title">هزینه‌های این روز</div><div id="expenseListBox">`;
  if(!data.expenses.length){
    html += `<div class="empty-note">هنوز هزینه‌ای ثبت نشده</div>`;
  } else {
    data.expenses.forEach(e=>{
      html += `
        <div class="expense-row">
          <div class="expense-desc">${e.desc}</div>
          <div class="expense-amt">${fmtAmount(e.amount)} تومان</div>
          <button class="expense-remove" data-id="${e.id}">✕</button>
        </div>`;
    });
  }
  html += `</div>
    <div class="add-expense-row">
      <input type="text" class="desc" id="newExpDesc" placeholder="بابت چی؟">
      <input type="number" class="amt" id="newExpAmt" placeholder="مبلغ (تومان)" step="0.01" inputmode="decimal">
      <button class="add-btn" id="addExpBtn">+</button>
    </div>
    <div class="day-sum">جمع امروز: ${fmtAmount(sum)} تومان</div>
  </div>`;

  document.getElementById('content').innerHTML = html;

  // bind events
  document.querySelectorAll('[data-act="toggle"]').forEach(el=>{
    el.addEventListener('click', ()=> toggleTask(decodeURIComponent(el.dataset.task)));
  });
  document.querySelectorAll('[data-act="remove"]').forEach(el=>{
    el.addEventListener('click', ()=> removeTask(decodeURIComponent(el.dataset.task)));
  });
  document.querySelectorAll('.task-reminder').forEach(el=>{
    el.addEventListener('change', ()=> setReminder(decodeURIComponent(el.dataset.task), el.value));
  });
  document.getElementById('addTaskBtn').addEventListener('click', addNewTask);
  document.getElementById('newTaskInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addNewTask(); });
  document.getElementById('addExpBtn').addEventListener('click', addExpense);
  document.querySelectorAll('.expense-remove').forEach(el=>{
    el.addEventListener('click', ()=> removeExpense(el.dataset.id));
  });
  const noteArea = document.getElementById('noteArea');
  let noteTimer = null;
  noteArea.addEventListener('input', ()=>{
    clearTimeout(noteTimer);
    noteTimer = setTimeout(saveNoteNow, 800);
  });
  async function saveNoteNow(){
    const d = await fetchDay(jy,jm,jd);
    d.note = noteArea.value;
    await saveDay(jy,jm,jd,d);
  }
  window.__saveCurrentDayNote = saveNoteNow;

  document.getElementById('notifBtn').addEventListener('click', ()=>{
    if("Notification" in window) Notification.requestPermission().then(p=>{
      showToast(p==='granted' ? 'اعلان‌ها فعال شد' : 'دسترسی اعلان داده نشد');
    });
  });

  async function toggleTask(task){
    const d = await fetchDay(jy,jm,jd);
    d.done = d.done.includes(task) ? d.done.filter(t=>t!==task) : [...d.done, task];
    await saveDay(jy,jm,jd,d);
    renderDayView();
  }
  async function removeTask(task){
    taskList = taskList.filter(t=>t!==task);
    await saveTasks();
    renderDayView();
  }
  async function setReminder(task,time){
    const d = await fetchDay(jy,jm,jd);
    if(time) d.reminders[task] = time; else delete d.reminders[task];
    await saveDay(jy,jm,jd,d);
  }
  async function addNewTask(){
    const input = document.getElementById('newTaskInput');
    const val = input.value.trim();
    if(!val || taskList.includes(val)){ input.value=''; return; }
    taskList.push(val);
    await saveTasks();
    renderDayView();
  }
  async function addExpense(){
    const descEl = document.getElementById('newExpDesc');
    const amtEl = document.getElementById('newExpAmt');
    const desc = descEl.value.trim();
    const amt = parseFloat(amtEl.value);
    if(!desc || !amt) return;
    const d = await fetchDay(jy,jm,jd);
    d.expenses.push({ id: 'e'+Date.now(), desc, amount: amt });
    await saveDay(jy,jm,jd,d);
    renderDayView();
  }
  async function removeExpense(id){
    const d = await fetchDay(jy,jm,jd);
    d.expenses = d.expenses.filter(e=>e.id!==id);
    await saveDay(jy,jm,jd,d);
    renderDayView();
  }
}

/* ---------- WEEK VIEW ---------- */
async function renderWeekView(){
  window.__saveCurrentDayNote = null;
  const {jy,jm,jd} = anchor;
  const shift = weekdayShift(jy,jm,jd);
  const start = addDaysJalali(jy,jm,jd,-shift);
  const weekDays = [];
  for(let i=0;i<7;i++){
    const dd = addDaysJalali(start[0],start[1],start[2], i);
    weekDays.push({jy:dd[0], jm:dd[1], jd:dd[2]});
  }
  document.getElementById('titleMain').textContent = `${weekDays[0].jd} ${jMonthNames[weekDays[0].jm-1]} تا ${weekDays[6].jd} ${jMonthNames[weekDays[6].jm-1]}`;
  document.getElementById('titleSub').textContent = `${weekDays[0].jy}`;

  let html = '';
  for(const wd of weekDays){
    const status = dateStatus(wd.jy,wd.jm,wd.jd);
    const data = await fetchDay(wd.jy,wd.jm,wd.jd);
    const done = data.done.length;
    const total = taskList.length;
    const sum = data.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
    const wdName = jWeekdayNames[weekdayShift(wd.jy,wd.jm,wd.jd)];
    html += `
      <div class="week-row status-${status}" data-jy="${wd.jy}" data-jm="${wd.jm}" data-jd="${wd.jd}">
        <div class="wd-name">${wdName}</div>
        <div class="wd-num">${wd.jd}</div>
        <div class="wd-stats">${total?`کار: ${done}/${total}`:''}${sum?` · هزینه: ${fmtAmount(sum)}`:''}</div>
      </div>`;
  }
  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('.week-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      setView('day', { jy: parseInt(el.dataset.jy), jm: parseInt(el.dataset.jm), jd: parseInt(el.dataset.jd) });
    });
  });
}

/* ---------- MONTH VIEW ---------- */
async function renderMonthView(){
  window.__saveCurrentDayNote = null;
  const {jy,jm} = anchor;
  document.getElementById('titleMain').textContent = jMonthNames[jm-1];
  document.getElementById('titleSub').textContent = `${jy}`;

  const daysInMonth = jDaysInMonth(jy,jm);
  const shift = weekdayShift(jy,jm,1);

  let gridHtml = `<div class="weekdays"><div>ش</div><div>ی</div><div>د</div><div>س</div><div>چ</div><div>پ</div><div>ج</div></div><div class="grid">`;
  for(let i=0;i<shift;i++) gridHtml += `<div class="day empty"></div>`;

  let monthTotal = 0;
  for(let d=1; d<=daysInMonth; d++){
    const status = dateStatus(jy,jm,d);
    const data = await fetchDay(jy,jm,d);
    const done = data.done.length;
    const total = taskList.length;
    const sum = data.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
    monthTotal += sum;
    gridHtml += `
      <div class="day status-${status}" data-jd="${d}">
        <div class="num">${d}</div>
        ${total ? `<div class="frac">${done}/${total}</div>` : ''}
        ${sum ? `<div class="exp-dot"></div>` : ''}
      </div>`;
  }
  gridHtml += `</div><div class="month-total">جمع هزینه ${jMonthNames[jm-1]}: ${fmtAmount(monthTotal)} تومان</div>`;

  document.getElementById('content').innerHTML = gridHtml;
  document.querySelectorAll('.day:not(.empty)').forEach(el=>{
    el.addEventListener('click', ()=>{
      setView('day', { jy, jm, jd: parseInt(el.dataset.jd) });
    });
  });
}

/* ---------- Save button + save-on-close ---------- */
document.getElementById('saveBtn').addEventListener('click', async ()=>{
  if(window.__saveCurrentDayNote) await window.__saveCurrentDayNote();
  showToast('✓ همه چیز ذخیره شد');
});
window.addEventListener('pagehide', ()=>{
  if(window.__saveCurrentDayNote) window.__saveCurrentDayNote();
});
window.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden' && window.__saveCurrentDayNote) window.__saveCurrentDayNote();
});

/* ---------- Init ---------- */
(async function init(){
  await loadTasks();
  await renderAll();
})();
</script>
</body>
</html>

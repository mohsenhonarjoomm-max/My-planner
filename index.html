<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>پلنر</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="پلنر">
<meta name="theme-color" content="#2f4a3a">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a3d33;
    --paper:#faf5ee;
    --paper-2:#f1e8db;
    --forest:#8ba173;
    --forest-deep:#4b5a3f;
    --gold:#c98a63;
    --gold-soft:#f2ddc8;
    --line: rgba(74,61,51,0.15);
    --red:#b5533f;
    --holiday:#a80000;
    --lilac:#f7ede1;
    --lilac-text:#8a6a4e;
    --past-bg:#cdc6ba;
    --today-bg:#a9bb95;
    --today-text:#23301c;
    --future-bg:#e6c9b4;
    --future-text:#6b4632;
  }
  html[data-theme="dark"]{
    --ink:#f3ece1;
    --paper:#241f1b;
    --paper-2:#332c25;
    --line: rgba(255,255,255,0.14);
    --holiday:#ff2d2d;
    --lilac:#4a3f34;
    --lilac-text:#f2ddc8;
    --past-bg:#3d362f;
    --today-bg:#5f7350;
    --today-text:#eef4e6;
    --future-bg:#6b4a3a;
    --future-text:#f2ddc8;
    --gold-soft:#4a3f34;
  }
  *{box-sizing:border-box;}
  html, body{ background: var(--paper); }
  body{
    margin:0;
    position:relative;
    font-family:'Vazirmatn', sans-serif;
    color: var(--ink);
    min-height:100vh;
    transition: background .2s, color .2s;
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 6px calc(60px + env(safe-area-inset-bottom)); position:relative; }

  /* Glassmorphism base — strong glossy highlight, translucency, and colored glow (like iOS glass UI) */
  .pill-btn, .theme-btn, .nav-btn, .add-btn, .alarm-btn, .notif-btn,
  .health-tab, .quick-nav-btn, .alarm-save-btn, .save-btn-top, .toast-close,
  .modal-close, .expense-remove, .income-remove, .gym-remove, .cal-meal-remove {
    background-image: linear-gradient(155deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.25) 40%, rgba(255,255,255,0.05) 70%);
    backdrop-filter: blur(16px) saturate(190%);
    -webkit-backdrop-filter: blur(16px) saturate(190%);
    border: 1.5px solid rgba(255,255,255,0.75);
    box-shadow: 0 6px 18px rgba(0,0,0,0.10), inset 0 1.5px 1px rgba(255,255,255,0.9), inset 0 -8px 12px -8px rgba(0,0,0,0.10);
    transition: transform .12s;
  }
  .pill-btn:active, .theme-btn:active, .add-btn:active, .alarm-btn:active,
  .health-tab:active, .quick-nav-btn:active, .alarm-save-btn:active, .save-btn-top:active {
    transform: scale(0.96);
  }
  html[data-theme="dark"] .pill-btn, html[data-theme="dark"] .theme-btn,
  html[data-theme="dark"] .nav-btn, html[data-theme="dark"] .add-btn,
  html[data-theme="dark"] .alarm-btn, html[data-theme="dark"] .notif-btn,
  html[data-theme="dark"] .health-tab, html[data-theme="dark"] .quick-nav-btn,
  html[data-theme="dark"] .alarm-save-btn, html[data-theme="dark"] .save-btn-top,
  html[data-theme="dark"] .toast-close, html[data-theme="dark"] .modal-close {
    background-image: linear-gradient(155deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0) 70%);
    border-color: rgba(255,255,255,0.28);
    box-shadow: 0 6px 18px rgba(0,0,0,0.4), inset 0 1.5px 1px rgba(255,255,255,0.2), inset 0 -8px 12px -8px rgba(0,0,0,0.3);
  }

  /* colored ambient glow per button type — this is what makes the glass read as glass */
  .save-btn-top, .add-btn, .alarm-save-btn{ box-shadow: 0 6px 20px color-mix(in srgb, var(--forest) 55%, transparent), inset 0 1.5px 1px rgba(255,255,255,0.9), inset 0 -8px 12px -8px rgba(0,0,0,0.1); }
  .alarm-btn{ box-shadow: 0 6px 20px color-mix(in srgb, var(--gold) 55%, transparent), inset 0 1.5px 1px rgba(255,255,255,0.9), inset 0 -8px 12px -8px rgba(0,0,0,0.1); }
  .health-tab.active{ box-shadow: 0 6px 20px color-mix(in srgb, var(--forest) 55%, transparent), inset 0 1.5px 1px rgba(255,255,255,0.9), inset 0 -8px 12px -8px rgba(0,0,0,0.1); }
  .pill-btn, .theme-btn, .nav-btn, .notif-btn, .quick-nav-btn, .health-tab:not(.active), .modal-close, .toast-close{
    box-shadow: 0 6px 18px color-mix(in srgb, var(--gold) 30%, transparent), inset 0 1.5px 1px rgba(255,255,255,0.9), inset 0 -8px 12px -8px rgba(0,0,0,0.08);
  }


  .planner-identity{ display:flex; align-items:center; justify-content:center; gap:6px; margin-top:8px; }
  .planner-avatar{
    width:18px; height:18px; border-radius:50%; background-color:var(--paper-2);
    background-size:cover; background-position:center; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:9px; flex-shrink:0;
  }
  .planner-name{ font-size:9px; font-weight:700; opacity:0.4; color:var(--ink); }
  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:300;
    display:none; align-items:center; justify-content:center;
  }
  .lightbox-overlay.open{ display:flex; }
  .lightbox-overlay img{ max-width:92vw; max-height:85vh; border-radius:10px; }
  .lightbox-close{
    position:absolute; top:calc(20px + env(safe-area-inset-top)); left:20px;
    width:38px; height:38px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.15); color:#fff; font-size:16px; cursor:pointer;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .icon-btn{
    display:flex; align-items:center; gap:4px;
    background:none; border:none;
    color:var(--forest-deep); font-weight:700; font-size:13px;
    font-family:'Vazirmatn',sans-serif;
    cursor:pointer; padding:6px 4px;
    opacity:1;
  }
  html[data-theme="dark"] .icon-btn{ color: var(--ink); }
  .icon-btn[disabled]{ opacity:0.3; cursor:default; }
  .pill-btn{
    background-color: color-mix(in srgb, var(--paper-2) 60%, transparent);
    border:1px solid var(--line);
    color: var(--ink);
    font-weight:700; font-size:12px;
    font-family:'Vazirmatn',sans-serif;
    border-radius:20px;
    padding:7px 14px;
    cursor:pointer;
  }
  .theme-btn{
    background-color: color-mix(in srgb, var(--paper-2) 60%, transparent);
    border:1px solid var(--line);
    border-radius:50%;
    width:34px; height:34px;
    font-size:15px;
    cursor:pointer;
  }
  .topbar-right{ display:flex; gap:8px; align-items:center; }

  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .nav-btn{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line); background-color: color-mix(in srgb, var(--paper-2) 60%, transparent);
    color:var(--ink); font-size:17px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .nav-btn:active{ transform: scale(0.92); }
  .nav-btn-group{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .nav-btn-label{ font-size:9.5px; font-weight:700; color:var(--ink); opacity:0.6; }
  .title-block{ text-align:center; flex:1; }
  .title-main{ font-size:28px; font-weight:800; color:var(--ink); letter-spacing:-.3px; }
  .title-sub{ font-size:12px; color:var(--gold); font-weight:700; margin-top:3px; letter-spacing:.5px; }

  .legend{
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    font-size:10.5px; color:var(--ink); opacity:0.8;
    margin-bottom:14px;
  }
  .legend span{ display:flex; align-items:center; gap:4px; }
  .dotleg{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* MONTH VIEW */
  .weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:8px; }
  .weekdays div{
    text-align:center; font-size:11px; font-weight:800; color:var(--lilac-text);
    background:var(--lilac); border-radius:8px; padding:6px 0;
  }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .day{
    position:relative; border-radius:12px; aspect-ratio:1/1;
    border:1px solid var(--line); padding:6px 2px 5px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    background: var(--past-bg); color: var(--ink); text-align:center;
  }
  .day.empty{ background:transparent; border:none; cursor:default; aspect-ratio:auto; }
  .day.status-today{ background: var(--today-bg); color:var(--today-text); }
  .day.status-future{ background: var(--future-bg); color:var(--future-text); }
  .day.status-past{ background: var(--past-bg); color:var(--ink); opacity:0.9; }
  .day .top-block{ display:flex; flex-direction:column; align-items:center; }
  .day .num{ font-size:14px; font-weight:800; line-height:1; }
  .day.is-holiday .num{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px;
    border:1.6px solid var(--holiday); border-radius:5px;
    color: var(--holiday); font-weight:800; font-size:11.5px;
  }
  .day .date-mini{ font-size:6.5px; opacity:0.85; font-weight:600; line-height:1.3; margin-top:2px; }
  .day .note-emoji{ font-size:17px; line-height:1; min-height:17px; }
  .month-total{
    margin-top:16px; background:var(--paper-2); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; text-align:center;
    font-size:14px; font-weight:700; color:var(--ink);
  }
  .month-bottom-row{
    display:flex; justify-content:flex-start; align-items:stretch; gap:8px; margin-top:16px;
  }
  .mb-stat{
    background:var(--paper-2); border:1px solid var(--line); border-radius:12px;
    padding:9px 14px; text-align:center; min-width:76px; cursor:pointer;
  }
  .mb-label{ font-size:10px; font-weight:700; opacity:0.65; margin-bottom:3px; }
  .mb-value{ font-size:13px; font-weight:800; color:var(--ink); }
  .report-day-group{ margin-bottom:12px; }
  .report-day-label{ font-size:11.5px; font-weight:800; color:var(--forest-deep); margin-bottom:4px; }
  .mb-icon-btn{
    width:40px; height:40px; flex-shrink:0;
    background: color-mix(in srgb, var(--gold) 22%, var(--paper-2));
    border:1px solid var(--line); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); cursor:pointer;
  }
  .conv-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .conv-header-btns{ display:flex; gap:6px; }
  .conv-header-btns .pill-btn{ padding:6px 11px; font-size:11px; }
  .conv-card{
    background:var(--paper-2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; text-align:center;
  }
  .conv-card-title{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:12.5px; font-weight:800; margin-bottom:7px; opacity:0.85; }
  .conv-fields{ display:grid; grid-template-columns:0.7fr 1.3fr 0.9fr; gap:6px; }
  .conv-fields input, .conv-fields select{
    width:100%; padding:9px 3px; border-radius:9px; border:1px solid var(--line);
    background:var(--paper); font-family:'Vazirmatn',sans-serif; font-size:13px; color:var(--ink);
    text-align:center; outline:none;
  }
  .conv-fields input:focus, .conv-fields select:focus{ border-color:var(--gold); }
  .conv-arrow{ text-align:center; font-size:14px; opacity:0.45; margin:3px 0; }

  /* WEEK VIEW */
  .week-row{
    display:flex; align-items:center; gap:12px;
    background:var(--past-bg); border:1px solid var(--line);
    border-radius:12px; padding:12px; margin-bottom:8px; cursor:pointer;
  }
  .week-row.status-today{ background: var(--today-bg); color:var(--today-text); }
  .week-row.status-future{ background: var(--future-bg); color:var(--future-text); }
  .week-row.status-past{ background: var(--past-bg); color:var(--ink); opacity:0.9; }
  .week-row .wd-name{ font-size:13px; font-weight:700; width:60px; }
  .week-row.is-holiday .wd-name{ color: var(--holiday); }
  .week-row .wd-num{ font-size:18px; font-weight:800; width:26px; }
  .week-row.is-holiday .wd-num{ color: var(--holiday); }
  .week-row .wd-stats{ flex:1; font-size:11px; opacity:0.85; text-align:left; }

  /* DAY VIEW */
  .day-header-card{
    text-align:center; border-radius:14px; padding:12px 14px 13px; margin-bottom:12px;
  }
  .dhc-status{ font-size:14px; font-weight:800; }
  .dhc-dates{ font-size:11px; font-weight:600; opacity:0.8; margin-top:4px; line-height:1.5; }
  .day-header-card.status-today{ background:var(--today-bg); color:var(--today-text); }
  .day-header-card.status-future{ background:var(--future-bg); color:var(--future-text); }
  .day-header-card.status-past{ background:var(--past-bg); color:var(--ink); }
  .holiday-banner{
    text-align:center; font-size:12.5px; font-weight:800; color:#fff;
    background:var(--holiday); border-radius:10px; padding:9px 14px; margin-bottom:10px;
  }
  .goals-reminder-card{
    background: color-mix(in srgb, var(--forest) 14%, var(--paper-2));
    border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:10px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .goals-reminder-title{ font-size:11.5px; font-weight:800; color:var(--forest-deep); white-space:nowrap; }
  .goals-reminder-item{ font-size:11.5px; color:var(--ink); opacity:0.9; }
  .goals-reminder-item::after{ content:'•'; margin-right:6px; opacity:0.5; }
  .goals-reminder-item:last-of-type::after{ content:''; }
  .goals-reminder-edit{ font-size:10.5px; font-weight:700; color:var(--gold); margin-right:auto; cursor:pointer; white-space:nowrap; }
  .quote-banner{
    text-align:center; font-size:12.5px; font-weight:600; color:var(--ink);
    background:var(--gold-soft); border-radius:10px; padding:10px 14px; margin-bottom:10px;
    line-height:1.7;
  }

  .section{ margin-bottom:22px; }
  .section-title{ font-size:14px; font-weight:800; color:var(--ink); margin-bottom:8px; }

  .task-list{ display:flex; flex-direction:column; }
  .task-row{
    display:flex; align-items:center; gap:8px;
    padding:6px 2px; border-bottom:1px solid var(--line);
  }
  .task-row:last-child{ border-bottom:none; }
  .task-check{
    width:19px; height:19px; border-radius:6px; border:2px solid var(--gold);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:transparent; font-size:11px; color:#fff;
  }
  .task-check.checked{ background:var(--forest); border-color:var(--forest); }
  .task-label{ flex:1; font-size:13px; cursor:pointer; }
  .task-row.checked .task-label{ color:var(--forest-deep); font-weight:700; }
  .task-row .clock-badge{ font-size:10px; opacity:0.8; color:var(--gold); }
  .task-row .chip-remove{ font-size:12px; opacity:0.55; padding:2px 4px; cursor:pointer; }
  .alarm-btn{
    background-color: color-mix(in srgb, var(--gold) 70%, transparent); color:#fff; border:none; border-radius:10px;
    padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; margin-top:10px;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.4);
    display:none; align-items:flex-end; justify-content:center; z-index:200;
  }
  .modal-overlay.open{ display:flex; }
  .modal-sheet{
    background:var(--paper); width:100%; max-width:720px; max-height:82vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-title{ font-size:16px; font-weight:800; color:var(--ink); }
  .modal-close{
    width:32px; height:32px; border-radius:50%; border:none;
    background-color: color-mix(in srgb, var(--paper-2) 60%, transparent); font-size:16px; cursor:pointer; color:var(--ink);
  }
  .alarm-task-row{
    display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line);
  }
  .alarm-task-row:last-child{ border-bottom:none; }
  .alarm-task-row input[type=checkbox]{ width:19px; height:19px; accent-color:var(--forest); }
  .alarm-task-row label{ flex:1; font-size:14px; color:var(--ink); }
  .alarm-time-row{ margin-top:16px; }
  .alarm-time-row label{ font-size:12px; font-weight:700; color:var(--ink); opacity:0.75; display:block; margin-bottom:6px; }
  .alarm-time-row input[type=time]{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper-2); font-family:'Vazirmatn',sans-serif; font-size:16px; color:var(--ink);
  }
  .alarm-save-btn{
    margin-top:16px; width:100%; padding:13px; border-radius:12px; border:none;
    background-color: color-mix(in srgb, var(--forest) 75%, transparent); color:#fff; font-weight:800; font-size:14px; cursor:pointer;
  }
  .search-input{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--paper-2); font-family:'Vazirmatn',sans-serif; font-size:15px; color:var(--ink);
    outline:none; margin-bottom:14px;
  }
  .search-input:focus{ border-color:var(--gold); }
  .search-result-row{
    display:block; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .search-result-row:last-child{ border-bottom:none; }
  .search-result-date{ font-size:12px; font-weight:800; color:var(--forest-deep); margin-bottom:3px; }
  .search-result-snippet{ font-size:12.5px; color:var(--ink); opacity:0.85; line-height:1.6; }
  .search-result-snippet mark{ background:var(--gold-soft); color:var(--ink); border-radius:3px; padding:0 2px; }
  .search-section-label{ font-size:11px; font-weight:800; opacity:0.6; margin:10px 0 4px; }
  .add-row{ display:flex; gap:8px; margin-top:10px; }
  .add-row input{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper-2); font-family:'Vazirmatn',sans-serif; font-size:13px; color:var(--ink); outline:none;
  }
  .add-row input:focus{ border-color:var(--gold); }
  .add-btn{
    background-color: color-mix(in srgb, var(--forest) 75%, transparent); color:#fff; border:none; border-radius:10px;
    padding:0 16px; font-weight:700; font-size:18px; cursor:pointer;
  }
  .empty-note{ text-align:center; padding:14px 0; color:var(--ink); opacity:0.5; font-size:12px; }

  .expense-row{
    display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--line);
  }
  .expense-row:last-child{ border-bottom:none; }
  .expense-desc{ flex:1; font-size:13px; }
  .expense-amt{ font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; }
  .expense-remove{ background:none; border:none; color:var(--red); font-size:14px; cursor:pointer; opacity:0.6; }
  .row-edit-btn{ font-size:12px; opacity:0.55; cursor:pointer; padding:0 2px; }
  .expense-row.editing-row{ background: color-mix(in srgb, var(--gold) 12%, transparent); border-radius:8px; }
  .add-expense-row{ display:flex; gap:6px; margin-top:6px; }
  .add-expense-row input{
    padding:10px 10px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper-2); font-family:'Vazirmatn',sans-serif; font-size:13px; color:var(--ink); outline:none;
  }
  .add-expense-row input.desc{ flex:1; }
  .add-expense-row input.amt{ width:100px; }
  .gym-copy-row{
    display:flex; flex-direction:column; gap:6px; margin-top:8px;
    font-size:11px; color:var(--ink); opacity:0.8;
  }
  .gym-copy-row label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .gym-copy-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--forest); }
  .gym-group-block{
    margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  .gym-group-block:last-child{ border-bottom:none; margin-bottom:0; }
  .gym-group-block .section-title{ margin-bottom:5px; }
  .day-sum{
    margin-top:10px; text-align:left; font-size:13px; font-weight:800; color:var(--ink);
  }

  .note-area{
    width:100%; min-height:110px; border-radius:12px; border:1px solid var(--line);

/* ---------- Jalali conversion (Birashk algorithm) ---------- */
function div(a,b){ return Math.floor(a/b); }
function gregorianToJalali(gy, gm, gd) {
  var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  var jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = (365*gy) + div(gy2+3,4) - div(gy2+99,100) + div(gy2+399,400) - 80 + gd + g_d_m[gm-1];
  jy += 33 * div(days,12053); days %= 12053;
  jy += 4 * div(days,1461); days %= 1461;
  if (days > 365) { jy += div(days-1,365); days = (days-1) % 365; }
  var jm, jd;
  if (days < 186) { jm = 1 + div(days,31); jd = 1 + (days % 31); }
  else { jm = 7 + div(days-186,30); jd = 1 + ((days-186) % 30); }
  return [jy, jm, jd];
}
function jalaliToGregorian(jy, jm, jd) {
  var gy = (jy <= 979) ? 621 : 1600;

  gy += 400 * div(days,146097); days %= 146097;
  if (days > 36524) { days--; gy += 100 * div(days,36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * div(days,1461); days %= 1461;
  if (days > 365) { gy += div(days-1,365); days = (days-1) % 365; }
  var gd = days + 1;
  var isLeapG = ((gy%4===0)&&(gy%100!==0))||(gy%400===0);
  var sal_a = [0,31,isLeapG?29:28,31,30,31,30,31,31,30,31,30,31];
  var gm;
  for (gm=1; gm<=12; gm++) { var v = sal_a[gm]; if (gd <= v) break; gd -= v; }
  return [gy, gm, gd];
}
function isLeapJalaliYear(jy){ return (25*jy + 11) % 33 < 8; }
function jDaysInMonth(jy, jm){

  const [gy,gm,gd] = jalaliToGregorian(jy,jm,jd);

  const y = gy + 4800 - a;
  const m = gm + 12*a - 3;
  return gd + Math.floor((153*m+2)/5) + 365*y + Math.floor(y/4) - Math.floor(y/100) + Math.floor(y/400) - 32045;
}
function jdnToGregorian(jdn){
  const a = jdn + 32044;
  const b = Math.floor((4*a+3)/146097);
  const c = a - Math.floor((146097*b)/4);
  const d = Math.floor((4*c+3)/1461);
  const e = c - Math.floor((1461*d)/4);
  const m = Math.floor((5*e+2)/153);
  const day = e - Math.floor((153*m+2)/5) + 1;
  const month = m + 3 - 12*Math.floor(m/10);
  const year = 100*b + d - 4800 + Math.floor(m/10);
  return [year, month, day];
}
const ISLAMIC_EPOCH = 1948440;
function hijriToJDN(hy,hm,hd){
  return hd + Math.ceil(29.5*(hm-1)) + (hy-1)*354 + Math.floor((3+11*hy)/30) + ISLAMIC_EPOCH - 1;
}
function jdnToHijri(jdn){
  const year = Math.floor((30*(jdn - ISLAMIC_EPOCH) + 10646) / 10631);
  const month = Math.min(12, Math.ceil((jdn - (29 + hijriToJDN(year,1,1))) / 29.5) + 1);
  const day = jdn - hijriToJDN(year, month, 1) + 1;
  return [year, month, day];
}
function getHijriDate(jy,jm,jd){
  const [gy,gm,gd] = jalaliToGregorian(jy,jm,jd);
  return jdnToHijri(gregorianToJDN(gy,gm,gd));
}
function formatGregorian(jy,jm,jd){
  const [gy,gm,gd] = jalaliToGregorian(jy,jm,jd);
  return `${gd} ${gMonthNames[gm-1]} ${gy}`;
}
function formatHijri(jy,jm,jd){
  const [hy,hm,hd] = getHijriDate(jy,jm,jd);
  return `${hd} ${hMonthNames[hm-1]} ${hy}`;
}

/* Fixed solar-Hijri holidays that fall on the same Jalali date every year */
const FIXED_HOLIDAYS = [
  {jm:1,jd:1,label:"نوروز"},

/* Lunar (Hijri)-based holidays shift a bit each Jalali year, so these are listed per-year.
   Currently filled in for 1405 based on the official calendar. Ask me to add more years. */
const HOLIDAYS_BY_YEAR = {
  1405: [
    {jm:1,jd:25,label:"شهادت امام جعفر صادق (ع)"},
    {jm:3,jd:6,label:"عید سعید قربان"},

    {jm:4,jd:4,label:"عاشورای حسینی"},
    {jm:5,jd:22,label:"شهادت امام رضا (ع)"},
    {jm:5,jd:30,label:"شهادت امام حسن عسکری (ع)"},
  ],
};
function getHolidayLabel(jy,jm,jd){
  const yearList = HOLIDAYS_BY_YEAR[jy] || [];
  const found = yearList.find(h=>h.jm===jm && h.jd===jd) || FIXED_HOLIDAYS.find(h=>h.jm===jm && h.jd===jd);
  const labels = [];
  if(found) labels.push(`ایران: ${found.label}`);
  const dubai = getDubaiHolidayLabel(jy,jm,jd);
  if(dubai) labels.push(`دبی: ${dubai}`);
  return labels.length ? labels.join(' • ') : null;
}
/* Dubai/UAE public holidays: fixed Gregorian ones + Hijri-month/day ones (computed dynamically,
   so accurate for any year; actual date can shift by a day depending on official moon sighting). */
function getDubaiHolidayLabel(jy,jm,jd){
  const [gy,gm,gd] = jalaliToGregorian(jy,jm,jd);
  if(gm===1 && gd===1) return "روز سال نو میلادی";
  if(gm===12 && gd===1) return "روز یادبود";
  if(gm===12 && (gd===2 || gd===3)) return "روز ملی امارات";
  const [,hm,hd] = getHijriDate(jy,jm,jd);
  if(hm===1 && hd===1) return "سال نو هجری قمری";
  if(hm===3 && hd===12) return "میلاد پیامبر (ص)";
  if(hm===12 && hd===9) return "روز عرفه";
  if(hm===12 && (hd===10 || hd===11 || hd===12)) return "عید سعید قربان";
  if(hm===10 && (hd===1 || hd===2 || hd===3)) return "عید سعید فطر";
  return null;
}
function isHoliday(jy,jm,jd){
  if(weekdayShift(jy,jm,jd) === 6) return true; // Friday
  return !!getHolidayLabel(jy,jm,jd);
}

  const [gy,gm,gd] = jalaliToGregorian(jy,jm,jd);
  const serial = Math.floor(new Date(gy,gm-1,gd).getTime()/86400000);
  let h = Math.abs(serial * 2654435761) % 2147483647;

const MUSCLE_GROUPS = ["سینه","سرشونه","زیر بغل","پا","جلو بازو","پشت بازو"];
function emptyGym(){
  const g = {};
  MUSCLE_GROUPS.forEach(k=>{ g[k] = []; });
  return g;
}
function emptyDayData(){ return { done: [], expenses: [], income: [], reminders: {}, note: '', healthNote: '', noteEmoji: '😊', meals: [], gym: emptyGym(), photos: [] }; }
function ensureGymShape(data){
  const old = data.gym;
  if(!old || Array.isArray(old.exercises) || typeof old !== 'object'){
    const migrated = emptyGym();
    if(old && Array.isArray(old.exercises) && old.exercises.length){
      migrated[MUSCLE_GROUPS[0]] = old.exercises;
    }
    data.gym = migrated;
  } else {
    MUSCLE_GROUPS.forEach(k=>{ if(!Array.isArray(data.gym[k])) data.gym[k] = []; });
  }
  return data;
}

function fetchDay(jy,jm,jd){
  const ck = dayCacheKey(jy,jm,jd);
  if(dayDataCache[ck]) return dayDataCache[ck];
  let data = emptyDayData();
  const raw = lsGet(storageKey(jy,jm,jd));
  if(raw){ try{ data = Object.assign(emptyDayData(), JSON.parse(raw)); }catch(e){} }
  ensureGymShape(data);
  dayDataCache[ck] = data;
  return data;
}

  dayDataCache[dayCacheKey(jy,jm,jd)] = data;

/* Resize + compress an uploaded image client-side (keeps localStorage usage small) */
function resizeImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function hexToRgb(hex){
  const h = hex.replace('#','');
  return { r: parseInt(h.substr(0,2),16), g: parseInt(h.substr(2,2),16), b: parseInt(h.substr(4,2),16) };
}
function hexLightness(hex){
  const {r,g,b} = hexToRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}
function contrastFor(hex){
  return hexLightness(hex) > 0.58 ? '#20261a' : '#f5f2ea';
}
function applyPalette(key){
  const root = document.documentElement.style;
  if(!key || !PALETTES[key]){
    ['--future-bg','--lilac','--gold-soft','--gold','--forest','--today-bg','--forest-deep','--today-text','--future-text','--lilac-text']
      .forEach(v => root.removeProperty(v));
    return;
  }
  const sorted = [...PALETTES[key].colors].sort((a,b)=> hexLightness(a)-hexLightness(b));
  const [c0,c1,c2,c3,c4] = sorted;
  root.setProperty('--future-bg', c0);
  root.setProperty('--lilac', c0);
  root.setProperty('--gold-soft', c1);
  root.setProperty('--gold', ensureDark(c2, 0.42));
  root.setProperty('--forest', ensureDark(c3, 0.38));
  root.setProperty('--today-bg', c3);
  root.setProperty('--forest-deep', ensureDark(c4, 0.30));

function normalizeFa(s){
  return (s||'')
    .replace(/\u200c/g, ' ')
    .replace(/[یي]/g, 'ی')
    .replace(/[کك]/g, 'ک')
    .replace(/[ۀه]$/g, 'ه')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}
/* common colloquial spellings mapped to the standard form used in FOOD_DB */
const FOOD_ALIASES = {
  "نون": "نان", "نون سنگک": "نان سنگک", "نون لواش": "نان لواش", "نون تست": "نان تست",
  "پرتغال": "پرتقال", "بادمجون": "بادمجان", "هندونه": "هندوانه", "خونه": "خونه",
  "گوجه": "گوجه‌فرنگی", "خیارچنبر": "خیار", "مرقد": "مرغ", "مرق": "مرغ",
  "چلو کباب": "چلوکباب", "قورمه سبزی": "قورمه‌سبزی", "زرشک پلو": "زرشک‌پلو",
  "ته چین": "ته‌چین", "باقالی پلو": "باقالی‌پلو",
};
function levenshtein(a,b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  const dp = Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function findFoodCalories(name){
  let n = normalizeFa(name);
  if(!n) return null;
  if(FOOD_ALIASES[n]) n = normalizeFa(FOOD_ALIASES[n]);

  // 1) exact match
  for(const key in FOOD_DB){
    if(normalizeFa(key) === n) return FOOD_DB[key];
  }
  // 2) substring match (either direction)
  for(const key in FOOD_DB){
    const nk = normalizeFa(key);
    if(nk.includes(n) || n.includes(nk)) return FOOD_DB[key];
  }
  // 3) word-overlap match — good for compound phrases like "نان تست پروتئین"
  const words = n.split(' ').filter(Boolean);
  let bestKey = null, bestScore = 0;
  for(const key in FOOD_DB){
    const kw = normalizeFa(key).split(' ').filter(Boolean);
    const overlap = words.filter(w => kw.includes(w)).length;
    if(overlap > bestScore){ bestScore = overlap; bestKey = key; }
  }
  if(bestKey && bestScore > 0) return FOOD_DB[bestKey];
  // 4) fuzzy match for small typos
  let closestKey = null, closestDist = Infinity;
  for(const key in FOOD_DB){
    const nk = normalizeFa(key);
    const d = levenshtein(n, nk);
    if(d < closestDist){ closestDist = d; closestKey = key; }
  }
  if(closestKey && closestDist <= Math.max(2, Math.floor(closestKey.length*0.3))) return FOOD_DB[closestKey];
  return null;
}

const UNIT_TO_GRAMS = {
  "گرم": 1, "گرمی": 1, "گ": 1,
  "کیلو": 1000, "کیلوگرم": 1000,
  "لیوان": 200, "پیمانه": 200, "فنجان": 200,

function parseAmount(text){
  const raw = (text||'').trim();
  if(!raw) return { grams: 0, label: '' };
  const faDigits = '۰۱۲۳۴۵۶۷۸۹';
  const normalized = raw.replace(/[۰-۹]/g, d => faDigits.indexOf(d));
  const match = normalized.match(/([\d.]+)\s*(.*)/);
  if(!match) return { grams: 0, label: raw };
  const num = parseFloat(match[1]) || 0;
  const unitText = normalizeFa(match[2] || 'گرم');
  let gramsPerUnit = 1;
  for(const u in UNIT_TO_GRAMS){
    if(unitText.includes(normalizeFa(u))){ gramsPerUnit = UNIT_TO_GRAMS[u]; break; }
  }
  return { grams: num * gramsPerUnit, label: raw };
}

  const parts = raw.split('-').map(Number);
  return { jy: parts[0], jm: parts[1], jd: parts[2] };

function highlightMatch(text, query){
  const nText = normalizeFa(text);
  const nQuery = normalizeFa(query);
  const idx = nText.indexOf(nQuery);
  if(idx === -1 || !nQuery) return text.length > 90 ? text.slice(0,90)+'…' : text;
  let start = Math.max(0, idx - 30);
  let end = Math.min(text.length, idx + nQuery.length + 40);
  let snippet = text.slice(start, end);
  if(start > 0) snippet = '…' + snippet;
  if(end < text.length) snippet = snippet + '…';
  // re-find match position within the trimmed snippet for highlighting (best-effort on original casing)
  const snippetNorm = normalizeFa(snippet);
  const localIdx = snippetNorm.indexOf(nQuery);
  if(localIdx === -1) return snippet;
  return snippet.slice(0,localIdx) + '<mark>' + snippet.slice(localIdx, localIdx+nQuery.length) + '</mark>' + snippet.slice(localIdx+nQuery.length);
}
function searchAllNotes(query){
  const nq = normalizeFa(query);
  if(!nq) return [];
  const results = [];
  scanAllDayKeys().forEach(key=>{
    let data;
    try{ data = JSON.parse(localStorage.getItem(key)); }catch(e){ return; }
    if(!data) return;
    const { jy, jm, jd } = parseDayKey(key);
    const fields = [
      { label: 'یادداشت', text: data.note || '' },
      { label: 'یادداشت سلامتی', text: data.healthNote || '' },
    ];
    fields.forEach(f=>{
      if(!f.text || !f.text.trim()) return;
      const nt = normalizeFa(f.text);
      let matched = nt.includes(nq);
      if(!matched && nq.length >= 3){
        const words = nt.split(' ');
        matched = words.some(w => w.length >= 3 && levenshtein(w, nq) <= 1);
      }
      if(matched){
        results.push({ jy, jm, jd, label: f.label, snippet: highlightMatch(f.text, query) });
      }
    });
  });
  results.sort((a,b) => (b.jy*372 + b.jm*31 + b.jd) - (a.jy*372 + a.jm*31 + a.jd));
  return results.slice(0, 40);
}
function recentNotes(){
  const results = [];
  scanAllDayKeys().forEach(key=>{
    let data;
    try{ data = JSON.parse(localStorage.getItem(key)); }catch(e){ return; }
    if(!data) return;
    const { jy, jm, jd } = parseDayKey(key);
    if(data.note && data.note.trim()){
      results.push({ jy, jm, jd, label: 'یادداشت', snippet: data.note.length>90?data.note.slice(0,90)+'…':data.note });
    }
    if(data.healthNote && data.healthNote.trim()){
      results.push({ jy, jm, jd, label: 'یادداشت سلامتی', snippet: data.healthNote.length>90?data.healthNote.slice(0,90)+'…':data.healthNote });
    }
  });
  results.sort((a,b) => (b.jy*372 + b.jm*31 + b.jd) - (a.jy*372 + a.jm*31 + a.jd));
  return results.slice(0, 15);
}

function closeSearchModal(){

}
document.getElementById('searchBtn').addEventListener('click', openSearchModal);
document.getElementById('goalsBtn').addEventListener('click', ()=> setView('goals', anchor));
document.getElementById('searchModalClose').addEventListener('click', closeSearchModal);
document.getElementById('searchModal').addEventListener('click', (e)=>{

});
let searchDebounce = null;
document.getElementById('searchInput').addEventListener('input', (e)=>{

/* ---------- Alarm modal ---------- */
function openAlarmModal(jy,jm,jd){
  window.__alarmCtx = {jy,jm,jd};
  let html = '';
  if(!taskList.length){
    html = '<div class="empty-note">هنوز کاری اضافه نکردی</div>';
  } else {
    taskList.forEach(t=>{
      const id = 'alarmChk_' + encodeURIComponent(t);
      html += `<div class="alarm-task-row"><input type="checkbox" id="${id}" value="${encodeURIComponent(t)}"><label for="${id}">${t}</label></div>`;
    });
  }
  document.getElementById('alarmTaskList').innerHTML = html;
  document.getElementById('alarmTimeInput').value = '';
  document.getElementById('alarmModal').classList.add('open');
}
function closeAlarmModal(){
  document.getElementById('alarmModal').classList.remove('open');
}
document.getElementById('alarmModalClose').addEventListener('click', closeAlarmModal);
document.getElementById('alarmModal').addEventListener('click', (e)=>{
  if(e.target.id === 'alarmModal') closeAlarmModal();
});
document.getElementById('alarmSaveBtn').addEventListener('click', async ()=>{
  const ctx = window.__alarmCtx;
  if(!ctx) return;
  const time = document.getElementById('alarmTimeInput').value;
  if(!time){ showToast('یه ساعت برای الارم انتخاب کن'); return; }
  const checked = Array.from(document.querySelectorAll('#alarmTaskList input[type=checkbox]:checked'));
  if(!checked.length){ showToast('حداقل یه کار رو انتخاب کن'); return; }
  const d = await fetchDay(ctx.jy, ctx.jm, ctx.jd);
  checked.forEach(cb=>{ d.reminders[decodeURIComponent(cb.value)] = time; });
  await saveDay(ctx.jy, ctx.jm, ctx.jd, d);
  closeAlarmModal();
  showToast('⏰ الارم ذخیره شد');
  if(view === 'day') renderDayView();
});

/* ---------- Navigation ---------- */
function setView(v, a){
  view = v;
  if(a) anchor = a;
  renderAll();
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  setView('month', anchor);
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  setView('day', { jy: tJy, jm: tJm, jd: tJd });
});
const DAY_SCOPED_VIEWS = ['day','health','finance'];
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(view === 'converter' || view === 'goals') return;
  if(DAY_SCOPED_VIEWS.includes(view)){ const n = addDaysJalali(anchor.jy,anchor.jm,anchor.jd,1); anchor={jy:n[0],jm:n[1],jd:n[2]}; }
  else if(view === 'week'){ const n = addDaysJalali(anchor.jy,anchor.jm,anchor.jd,7); anchor={jy:n[0],jm:n[1],jd:n[2]}; }
  else{ anchor.jm++; if(anchor.jm>12){anchor.jm=1; anchor.jy++;} anchor.jd = Math.min(anchor.jd, jDaysInMonth(anchor.jy,anchor.jm)); }
  renderAll();
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(view === 'converter' || view === 'goals') return;
  if(DAY_SCOPED_VIEWS.includes(view)){ const n = addDaysJalali(anchor.jy,anchor.jm,anchor.jd,-1); anchor={jy:n[0],jm:n[1],jd:n[2]}; }
  else if(view === 'week'){ const n = addDaysJalali(anchor.jy,anchor.jm,anchor.jd,-7); anchor={jy:n[0],jm:n[1],jd:n[2]}; }
  else{ anchor.jm--; if(anchor.jm<1){anchor.jm=12; anchor.jy--;} anchor.jd = Math.min(anchor.jd, jDaysInMonth(anchor.jy,anchor.jm)); }
  renderAll();
});

/* ---------- Render dispatch ---------- */
async function renderAll(){
  document.getElementById('backBtn').disabled = (view === 'month');
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">در حال بارگذاری...</div>';
  if(view === 'day') await renderDayView();
  else if(view === 'week') await renderWeekView();
  else if(view === 'health') await renderHealthView();
  else if(view === 'finance') await renderFinanceView();
  else if(view === 'converter') await renderConverterView();
  else if(view === 'goals') await renderGoalsView();
  else await renderMonthView();
}

/* ---------- DAY VIEW ---------- */
async function renderDayView(){
  const {jy,jm,jd} = anchor;
  const status = dateStatus(jy,jm,jd);
  const shift = weekdayShift(jy,jm,jd);
  const wd = jWeekdayNames[shift];
  const holidayLabel = getHolidayLabel(jy,jm,jd) || (shift===6 ? 'جمعه' : null);

  document.getElementById('titleMain').textContent = `${wd} ${jd} ${jMonthNames[jm-1]}`;
  document.getElementById('titleSub').textContent = `${jy}`;

  const data = await fetchDay(jy,jm,jd);

  const settings = loadSettings();

  const statusLabel = status==='past' ? 'این روز گذشته' : status==='today' ? 'امروز' : 'در انتظار این روز';
  let html = `<div class="day-header-card status-${status}">
    <div class="dhc-status">${statusLabel}</div>
    <div class="dhc-dates">میلادی: ${formatGregorian(jy,jm,jd)} &nbsp;•&nbsp; قمری: ${formatHijri(jy,jm,jd)}</div>
  </div>`;
  if(holidayLabel) html += `<div class="holiday-banner">🔴 تعطیل — ${holidayLabel}</div>`;

  if(settings.features.goals !== false){
    const myActiveGoals = activeGoals();
    if(myActiveGoals.length){
      html += `<div class="goals-reminder-card">
        <div class="goals-reminder-title">🎯 اهداف فعالت</div>
        ${myActiveGoals.map(g=>`<div class="goals-reminder-item">${g.text}</div>`).join('')}
        <div class="goals-reminder-edit" id="goToGoalsBtn">مدیریت اهداف ←</div>
      </div>`;
    }
  }

  if(settings.features.quote !== false){
    html += `<div class="quote-banner">✨ ${getDayQuote(jy,jm,jd)}</div>`;
  }

  const calTotal = dayCalorieTotal(data);
  const expSum = data.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const incSum = (data.income||[]).reduce((s,e)=>s+Number(e.amount||0),0);

  const showHealthBtn = (settings.features.calorie !== false) || (settings.features.gymSets !== false);
  const showFinanceBtn = settings.features.finance !== false;
  if(showHealthBtn || showFinanceBtn){
    html += `<div class="quick-nav-row">`;
    if(showHealthBtn){
      html += `<div class="quick-nav-btn" id="openHealthTab">
        <span class="qn-label">🏋️ ورزش و سلامتی</span>
        <span class="qn-value">🔥 ${fmtAmount(calTotal)} کالری</span>
      </div>`;
    }
    if(showFinanceBtn){
      html += `<div class="quick-nav-btn" id="openFinanceTab">
        <span class="qn-label">💰 هزینه‌ها و درآمد</span>
        <span class="qn-value">هزینه ${fmtCompact(expSum)} · درآمد ${fmtCompact(incSum)}</span>
      </div>`;
    }
    html += `</div>`;
  }

  // Tasks
  html += `<div class="section"><div class="section-title">کارهای روزانه</div><div class="task-list" id="taskListBox">`;
  if(!taskList.length){
    html += `<div class="empty-note">هنوز کاری اضافه نکردی</div>`;
  } else {
    taskList.forEach(task=>{
      const checked = data.done.includes(task);
      const hasReminder = !!data.reminders[task];
      html += `
        <div class="task-row ${checked?'checked':''}">
          <div class="task-check ${checked?'checked':''}" data-task="${encodeURIComponent(task)}" data-act="toggle">${checked?'✓':''}</div>
          <div class="task-label" data-task="${encodeURIComponent(task)}" data-act="toggle">${task}</div>
          ${hasReminder ? `<span class="clock-badge">⏰${data.reminders[task]}</span>` : ''}
          <span class="chip-remove" data-task="${encodeURIComponent(task)}" data-act="remove">✕</span>
        </div>`;
    });
  }
  html += `</div>
    <div class="add-row">
      <input type="text" id="newTaskInput" placeholder="کار جدید، مثلاً: آموزش زبان">
      <button class="add-btn" id="addTaskBtn">+</button>
    </div>
    <button class="alarm-btn" id="openAlarmBtn">⏰ تنظیم الارم</button>
  </div>`;

  // Note
  if(settings.features.note !== false){
    const photos = data.photos || [];
    html += `<div class="section">
      <div class="section-title" style="display:flex; align-items:center; justify-content:space-between;">
        <span>یادداشت</span>
        <span class="note-photo-btn" id="notePhotoBtn">📷</span>
      </div>
      <input type="file" id="notePhotoInput" accept="image/*" style="display:none;">
      <textarea class="note-area" id="noteArea" placeholder="هر چیزی که می‌خوای برای این روز یادت بمونه...">${(data.note||'').replace(/</g,'&lt;')}</textarea>
      <div class="note-photos" id="notePhotosBox">
        ${photos.map(p=>`
          <div class="note-photo-thumb-wrap">
            <img src="${p.dataUrl}" class="note-photo-thumb" data-full="${p.dataUrl}">
            <span class="note-photo-remove" data-id="${p.id}">✕</span>
          </div>`).join('')}
      </div>
    </div>`;
  }

  // Reminders (یادآوری) — separate from notes, date-triggered popup reminders
  {
    const allReminders = loadFutureReminders();
    html += `<div class="section"><div class="section-title">🔔 یادآوری</div>
      <div class="reminder-note" style="margin-bottom:8px;">یه یادآوری برای یه روزِ جلوتر بنویس؛ وقتی اون روز رسید، هر بار پلنر رو باز کنی وسط صفحه بهت نشونش می‌ده (۱۰ ثانیه، با دکمه‌ی بستن) — تا وقتی خودت خاموشش نکنی، حداکثر تا ۶ ساعت.</div>
      <input type="text" id="remText" placeholder="متن یادآوری" style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper-2);font-family:'Vazirmatn',sans-serif;font-size:13px;color:var(--ink);outline:none;margin-bottom:8px;">
      <div class="conv-fields" style="margin-bottom:8px;">
        <input type="number" id="remDay" placeholder="روز" min="1" max="31">
        <select id="remMonth"><option value="">ماه</option>${jMonthNames.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('')}</select>
        <input type="number" id="remYear" placeholder="سال" value="${jy}">
      </div>
      <input type="time" id="remAlarmTime" style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper-2);font-family:'Vazirmatn',sans-serif;font-size:13px;color:var(--ink);outline:none;margin-bottom:8px;">
      <button class="alarm-save-btn" id="addReminderBtn" style="margin-top:0;">+ افزودن یادآوری</button>
      <div id="reminderListBox" style="margin-top:10px;">
        ${allReminders.length ? allReminders.map(r=>`
          <div class="task-row ${r.active?'checked':''}">
            <div class="task-check ${r.active?'checked':''}" data-id="${r.id}" data-act="rem-toggle">${r.active?'✓':''}</div>
            <div class="task-label" data-id="${r.id}" data-act="rem-toggle">${r.text} <span style="opacity:0.6;font-size:11px;">(${r.targetJd} ${jMonthNames[r.targetJm-1]} ${r.targetJy}${r.alarmTime?' · '+r.alarmTime:''})</span></div>
            <span class="chip-remove" data-id="${r.id}" data-act="rem-remove">✕</span>
          </div>`).join('') : '<div class="empty-note">هنوز یادآوری‌ای ثبت نشده</div>'}
      </div>
    </div>`;
  }

  document.getElementById('content').innerHTML = html;

  // bind events
  document.querySelectorAll('[data-act="toggle"]').forEach(el=>{
    el.addEventListener('click', ()=> toggleTask(decodeURIComponent(el.dataset.task)));
  });
  document.querySelectorAll('[data-act="remove"]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); removeTask(decodeURIComponent(el.dataset.task)); });
  });
  document.getElementById('addTaskBtn').addEventListener('click', addNewTask);
  document.getElementById('newTaskInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addNewTask(); });
  document.getElementById('openAlarmBtn').addEventListener('click', ()=> openAlarmModal(jy,jm,jd));
  if(document.getElementById('openHealthTab')){
    document.getElementById('openHealthTab').addEventListener('click', ()=> setView('health', {jy,jm,jd}));
  }
  if(document.getElementById('openFinanceTab')){
    document.getElementById('openFinanceTab').addEventListener('click', ()=> setView('finance', {jy,jm,jd}));
  }
  if(document.getElementById('goToGoalsBtn')){
    document.getElementById('goToGoalsBtn').addEventListener('click', ()=> setView('goals', {jy,jm,jd}));
  }
  if(status === 'today') maybeShowGoalsReminder();

  document.getElementById('addReminderBtn').addEventListener('click', ()=>{
    const textEl = document.getElementById('remText');
    const dEl = document.getElementById('remDay');
    const mEl = document.getElementById('remMonth');
    const yEl = document.getElementById('remYear');
    const tEl = document.getElementById('remAlarmTime');
    const text = textEl.value.trim();
    if(!text){ showToast('متن یادآوری رو بنویس'); return; }
    if(!dEl.value || !mEl.value || !yEl.value){ showToast('تاریخ یادآوری رو کامل کن'); return; }
    const list = loadFutureReminders();
    list.push({
      id: 'rem'+Date.now(),
      text,
      targetJy: parseInt(yEl.value),
      targetJm: parseInt(mEl.value),
      targetJd: parseInt(dEl.value),
      alarmTime: tEl.value || null,
      active: false,
      firstShownAt: null,
    });
    saveFutureReminders(list);
    renderDayView();
  });
  document.querySelectorAll('[data-act="rem-toggle"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const list = loadFutureReminders();
      const r = list.find(x=>x.id===el.dataset.id);
      if(r){ r.active = !r.active; if(r.active) r.firstShownAt = null; }
      saveFutureReminders(list);
      renderDayView();
    });
  });
  document.querySelectorAll('[data-act="rem-remove"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const list = loadFutureReminders().filter(x=>x.id!==el.dataset.id);
      saveFutureReminders(list);
      renderDayView();
    });
  });

  const noteArea = document.getElementById('noteArea');
  let noteTimer = null;
  if(noteArea){
    noteArea.addEventListener('input', ()=>{
      clearTimeout(noteTimer);
      noteTimer = setTimeout(saveNoteNow, 800);
    });
  }
  async function saveNoteNow(){
    const d = await fetchDay(jy,jm,jd);
    d.note = noteArea.value;
    await saveDay(jy,jm,jd,d);
  }
  if(noteArea) window.__saveCurrentDayNote = saveNoteNow;

  if(document.getElementById('notePhotoBtn')){
    document.getElementById('notePhotoBtn').addEventListener('click', ()=>{
      document.getElementById('notePhotoInput').click();
    });
    document.getElementById('notePhotoInput').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const dataUrl = await resizeImageToDataUrl(file, 900, 0.72);
      const d = await fetchDay(jy,jm,jd);
      d.photos = d.photos || [];
      d.photos.push({ id:'p'+Date.now(), dataUrl });
      await saveDay(jy,jm,jd,d);
      renderDayView();
    });
    document.querySelectorAll('.note-photo-thumb').forEach(el=>{
      el.addEventListener('click', ()=> openPhotoLightbox(el.dataset.full));
    });
    document.querySelectorAll('.note-photo-remove').forEach(el=>{
      el.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const d = await fetchDay(jy,jm,jd);
        d.photos = (d.photos||[]).filter(p=>p.id!==el.dataset.id);
        await saveDay(jy,jm,jd,d);
        renderDayView();
      });
    });
  }

  async function toggleTask(task){
    const d = await fetchDay(jy,jm,jd);
    d.done = d.done.includes(task) ? d.done.filter(t=>t!==task) : [...d.done, task];
    await saveDay(jy,jm,jd,d);
    renderDayView();
  }
  async function removeTask(task){
    taskList = taskList.filter(t=>t!==task);
    await saveTasks();
    renderDayView();
  }
  async function addNewTask(){
    const input = document.getElementById('newTaskInput');
    const val = input.value.trim();
    if(!val || taskList.includes(val)){ input.value=''; return; }
    taskList.push(val);
    await saveTasks();
    renderDayView();
  }
}

async function renderCalorieContent(jy,jm,jd){
  const data = await fetchDay(jy,jm,jd);
  const total = dayCalorieTotal(data);
  const monthTotal = await monthCalorieTotal(jy,jm);

  let html = `<div class="day-sum" style="text-align:center;font-size:18px;margin-bottom:16px;">جمع امروز: ${fmtAmount(total)} کالری</div>`;
  html += `<div class="section"><div class="section-title">یادداشت سلامتی</div>
    <textarea class="note-area" id="healthNoteArea" placeholder="مثلاً: امروز حس گشنگی زیاد داشتم، رژیم رو رعایت کردم و غیره..." style="min-height:70px;">${(data.healthNote||'').replace(/</g,'&lt;')}</textarea>
  </div>`;
  html += `<div class="cal-add-form">
    <input type="text" id="calFoodInput" list="foodDataList" placeholder="اسم غذا، مثلاً: نان تست پروتئین">
    <input type="text" id="calAmountInput" placeholder="مقدار — مثلاً: ۲۰۰ گرم، ۱ لیوان، ۲ عدد، ۱ کاسه">
    <input type="number" id="calManualInput" placeholder="کالری این وعده (خودت وارد کن یا بذار خودکار حساب کنه)">
    <div class="cal-preview" id="calPreview"></div>
    <button class="alarm-save-btn" id="calAddBtn">افزودن</button>
  </div>`;
  html += `<div id="calMealList"></div>`;
  html += `<div class="day-sum">جمع کالری این ماه: ${fmtAmount(monthTotal)} کالری</div>`;

  document.getElementById('healthContent').innerHTML = html;

  const healthNoteArea = document.getElementById('healthNoteArea');
  let healthNoteTimer = null;
  healthNoteArea.addEventListener('input', ()=>{
    clearTimeout(healthNoteTimer);
    healthNoteTimer = setTimeout(async ()=>{
      const d = await fetchDay(jy,jm,jd);
      d.healthNote = healthNoteArea.value;
      await saveDay(jy,jm,jd,d);
    }, 700);
  });

  function renderMealList(){
    const d = fetchDay(jy,jm,jd);
    const meals = d.meals || [];
    let mhtml = '';
    if(!meals.length){
      mhtml = '<div class="empty-note">هنوز چیزی برای امروز ثبت نشده</div>';
    } else {
      meals.forEach(m=>{
        mhtml += `
          <div class="cal-meal-row">
            <div class="cal-meal-desc">${m.name} ${m.amount ? `<span class="amt">(${m.amount})</span>` : ''}</div>
            <div class="cal-meal-kcal">${fmtAmount(m.kcal)} کالری</div>
            <button class="cal-meal-remove" data-id="${m.id}">✕</button>
          </div>`;
      });
    }
    document.getElementById('calMealList').innerHTML = mhtml;
    document.querySelectorAll('.cal-meal-remove').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const dd = await fetchDay(jy,jm,jd);
        dd.meals = dd.meals.filter(m=>m.id !== el.dataset.id);
        await saveDay(jy,jm,jd,dd);
        renderHealthView();
      });
    });
  }
  renderMealList();

  if(!document.getElementById('foodDataList')){
    document.body.insertAdjacentHTML('beforeend', '<datalist id="foodDataList"></datalist>');
  }
  document.getElementById('foodDataList').innerHTML = Object.keys(FOOD_DB).map(k=>`<option value="${k}">`).join('');

  function refreshPreview(){
    const name = document.getElementById('calFoodInput').value;
    const amountText = document.getElementById('calAmountInput').value;
    const parsed = parseAmount(amountText);
    const manualInput = document.getElementById('calManualInput');
    const preview = document.getElementById('calPreview');
    const per100 = findFoodCalories(name);
    if(per100 !== null && parsed.grams > 0){
      manualInput.value = Math.round(per100 * parsed.grams / 100);
      preview.textContent = `≈ ${manualInput.value} کالری (بر اساس ${Math.round(parsed.grams)} گرم تخمینی — می‌تونی دستی عوضش کنی)`;
    } else if(per100 !== null){
      preview.textContent = `${per100} کالری در هر ۱۰۰ گرم — مقدار رو بنویس (گرم، لیوان، عدد...) یا خودت کالری کل رو بنویس`;
    } else if(name.trim()){
      preview.textContent = 'این غذا تو لیست نیست — کالریش رو خودت بنویس';
    } else {
      preview.textContent = '';
    }
  }
  document.getElementById('calFoodInput').addEventListener('input', refreshPreview);
  document.getElementById('calAmountInput').addEventListener('input', refreshPreview);

  document.getElementById('calAddBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('calFoodInput').value.trim();
    const amountText = document.getElementById('calAmountInput').value.trim();
    const kcal = parseFloat(document.getElementById('calManualInput').value);
    if(!name){ showToast('اسم غذا رو بنویس'); return; }
    if(kcal === undefined || kcal === null || isNaN(kcal)){ showToast('کالری رو وارد کن'); return; }
    const d = await fetchDay(jy,jm,jd);
    d.meals.push({ id:'m'+Date.now(), name, amount: amountText, kcal });
    await saveDay(jy,jm,jd,d);
    renderHealthView();
  });
}
async function monthCalorieTotal(jy,jm){
  const daysInMonth = jDaysInMonth(jy,jm);
  let total = 0;
  for(let d=1; d<=daysInMonth; d++){
    const data = await fetchDay(jy,jm,d);
    total += dayCalorieTotal(data);
  }
  return total;
}

async function copyGymGroupForward(jy,jm,jd,group,daysCount){
  const source = await fetchDay(jy,jm,jd);
  const sourceList = JSON.parse(JSON.stringify(source.gym[group] || []));
  for(let i=1; i<=daysCount; i++){
    const [ty,tm,td] = addDaysJalali(jy,jm,jd,i);
    const target = await fetchDay(ty,tm,td);
    target.gym[group] = JSON.parse(JSON.stringify(sourceList));
    await saveDay(ty,tm,td,target);
  }
}

    await saveDay(jy,jm,jd,d);
    renderFinanceView();
  }

/* ---------- FUTURE REMINDERS (separate from goals — date + time triggered) ---------- */
function loadFutureReminders(){
  const raw = lsGet('reminders_list');
  return raw ? JSON.parse(raw) : [];
}
function saveFutureReminders(list){ lsSet('reminders_list', JSON.stringify(list)); }
function dueReminders(){
  const list = loadFutureReminders();
  const nowTs = Date.now();
  const todaySerial = tJy*372 + tJm*31 + tJd;
  return list.filter(r=>{
    if(!r.active || !r.targetJy) return false;
    const targetSerial = r.targetJy*372 + r.targetJm*31 + r.targetJd;
    if(targetSerial > todaySerial) return false;
    if(targetSerial === todaySerial && r.alarmTime){
      const [hh,mm] = r.alarmTime.split(':').map(Number);
      const now = new Date();
      if(now.getHours()*60+now.getMinutes() < hh*60+mm) return false;
    }
    if(r.firstShownAt && (nowTs - r.firstShownAt) > 6*3600*1000) return false;
    return true;
  });
}
function cleanupExpiredReminders(){
  const list = loadFutureReminders();
  let changed = false;
  const nowTs = Date.now();
  list.forEach(r=>{
    if(r.active && r.firstShownAt && (nowTs - r.firstShownAt) > 6*3600*1000){
      r.active = false; changed = true;
    }
  });
  if(changed) saveFutureReminders(list);
}
function maybeShowReminderPopup(){
  cleanupExpiredReminders();
  const due = dueReminders();
  if(!due.length) return;
  const list = loadFutureReminders();
  let changed = false;
  due.forEach(r=>{
    const item = list.find(x=>x.id===r.id);
    if(item && !item.firstShownAt){ item.firstShownAt = Date.now(); changed = true; }
  });
  if(changed) saveFutureReminders(list);
  document.getElementById('reminderPopupList').innerHTML = due.map(r=>{
    const dateLabel = `${r.targetJd} ${jMonthNames[r.targetJm-1]} ${r.targetJy}`;
    return `<div class="reminder-popup-item"><b>${r.text}</b><span>${dateLabel}${r.alarmTime?` · ${r.alarmTime}`:''}</span></div>`;
  }).join('');
  document.getElementById('reminderPopupOverlay').classList.add('open');
  clearTimeout(window.__reminderPopupTimer);
  window.__reminderPopupTimer = setTimeout(closeReminderPopup, 10000);
}
function closeReminderPopup(){
  document.getElementById('reminderPopupOverlay').classList.remove('open');
  clearTimeout(window.__reminderPopupTimer);
}

      <button class="alarm-save-btn" id="addGoalBtn" style="margin-top:0;">${editingGoal ? '✓ ذخیره ویرایش' : '+ افزودن هدف'}</button>

  html += `<div class="section"><div class="section-title">لیست اهداف</div><div id="goalsList">`;

    goals.forEach((g,idx)=>{
      const hasDate = g.targetJy && g.targetJm && g.targetJd;
      const dateLabel = hasDate ? `${g.targetJd} ${jMonthNames[g.targetJm-1]} ${g.targetJy}` : '';
      let daysLabel = '';
      if(hasDate){
        const targetSerial = g.targetJy*372 + g.targetJm*31 + g.targetJd;
        const diff = targetSerial - todaySerial;
        daysLabel = diff > 0 ? `${diff} روز مونده` : diff === 0 ? 'امروزه!' : `${-diff} روز گذشته`;
      }
      html += `
        <div class="goal-card ${g.active?'active':''}${g.id===editingGoalId?' editing':''}">

    const mEl = document.getElementById('goalMonth');

    const text = textEl.value.trim();
    if(!text){ showToast('متن هدف رو بنویس'); return; }
    const list = loadGoals();
    const targetJy = yEl.value ? parseInt(yEl.value) : null;
    const targetJm = mEl.value ? parseInt(mEl.value) : null;
    const targetJd = dEl.value ? parseInt(dEl.value) : null;

    el.addEventListener('click', ()=>{

      const g = list.find(x=>x.id===el.dataset.id);

      renderGoalsView();
    });
  });
  document.querySelectorAll('[data-act="goal-remove"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(editingGoalId === el.dataset.id) editingGoalId = null;
      const list = loadGoals().filter(x=>x.id!==el.dataset.id);
      saveGoalsData(list);
      renderGoalsView();
    });
  });
  document.querySelectorAll('[data-act="goal-edit"]').forEach(el=>{
    el.addEventListener('click', (e)=>{

      setTimeout(()=>{
        const box = document.getElementById('goalTextInput');
        if(box){ box.focus(); box.scrollIntoView({behavior:'smooth', block:'center'}); }

    });
  });
  document.querySelectorAll('[data-act="goal-up"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const list = loadGoals();
      const i = list.findIndex(x=>x.id===el.dataset.id);

  document.querySelectorAll('[data-act="goal-down"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();

      if(i !== -1 && i < list.length-1){ [list[i+1], list[i]] = [list[i], list[i+1]]; saveGoalsData(list); renderGoalsView(); }
    });
  });
}

function ensureDark(hex, maxL){
  maxL = maxL || 0.42;
  const {r,g,b} = hexToRgb(hex);
  const L = hexLightness(hex);
  if(L <= maxL) return hex;
  const scale = maxL / L;
  const rr = Math.max(0, Math.round(r*scale));
  const gg = Math.max(0, Math.round(g*scale));
  const bb = Math.max(0, Math.round(b*scale));
  return '#' + [rr,gg,bb].map(v=>v.toString(16).padStart(2,'0')).join('');
}

          ${gMonthNames.map((n,i)=>`<option value="${i+1}">${n} (${i+1})</option>`).join('')}

        <input type="number" id="convGy" placeholder="سال">
      </div>
    </div>
    <div class="conv-arrow">⇅</div>
    <div class="conv-card">
      <div class="conv-card-title">${ICON_MOON}<span>قمری</span></div>
      <div class="conv-fields">
        <input type="number" id="convHd" placeholder="روز" min="1" max="30">
        <select id="convHm">
          <option value="">ماه</option>
          ${hMonthNames.map((n,i)=>`<option value="${i+1}">${n} (${i+1})</option>`).join('')}
        </select>
        <input type="number" id="convHy" placeholder="سال">
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
  document.getElementById('backToMonthBtn').addEventListener('click', ()=> setView('month', anchor));

  const fJy = document.getElementById('convJy'), fJm = document.getElementById('convJm'), fJd = document.getElementById('convJd');
  const fGy = document.getElementById('convGy'), fGm = document.getElementById('convGm'), fGd = document.getElementById('convGd');
  const fHy = document.getElementById('convHy'), fHm = document.getElementById('convHm'), fHd = document.getElementById('convHd');
  const allFields = [fJy,fJm,fJd,fGy,fGm,fGd,fHy,fHm,fHd];

  function clearAll(){
    allFields.forEach(f=> f.value = '');
  }

  function fillFromJalali(jy,jm,jd){
    const [gy,gm,gd] = jalaliToGregorian(jy,jm,jd);
    const [hy,hm,hd] = jdnToHijri(gregorianToJDN(gy,gm,gd));
    fGy.value=gy; fGm.value=gm; fGd.value=gd;
    fHy.value=hy; fHm.value=hm; fHd.value=hd;
  }
  function fillFromGregorian(gy,gm,gd){
    const [jy,jm,jd] = gregorianToJalali(gy,gm,gd);
    const [hy,hm,hd] = jdnToHijri(gregorianToJDN(gy,gm,gd));
    fJy.value=jy; fJm.value=jm; fJd.value=jd;
    fHy.value=hy; fHm.value=hm; fHd.value=hd;
  }
  function fillFromHijri(hy,hm,hd){
    const jdn = hijriToJDN(hy,hm,hd);
    const [gy,gm,gd] = jdnToGregorian(jdn);
    const [jy,jm,jd] = gregorianToJalali(gy,gm,gd);
    fJy.value=jy; fJm.value=jm; fJd.value=jd;
    fGy.value=gy; fGm.value=gm; fGd.value=gd;
  }

  // If a group becomes incomplete (partially OR fully cleared), reset the whole
  // converter so no stale/mismatched values are left in the other two groups.
  function groupIncomplete(y,m,d){
    const filled = [y.value, m.value, d.value].filter(v=>v!=='').length;
    return filled < 3;
  }

  function tryFillJalali(){
    if(groupIncomplete(fJy,fJm,fJd)){
      const stillHasOthers = fGy.value || fHy.value;
      if(stillHasOthers){ clearAll(); }
      return;
    }
    const jy=parseInt(fJy.value), jm=parseInt(fJm.value), jd=parseInt(fJd.value);
    if(jy && jm>=1 && jm<=12 && jd>=1 && jd<=31) fillFromJalali(jy,jm,jd);
  }
  function tryFillGregorian(){
    if(groupIncomplete(fGy,fGm,fGd)){
      const stillHasOthers = fJy.value || fHy.value;
      if(stillHasOthers){ clearAll(); }
      return;
    }
    const gy=parseInt(fGy.value), gm=parseInt(fGm.value), gd=parseInt(fGd.value);
    if(gy && gm>=1 && gm<=12 && gd>=1 && gd<=31) fillFromGregorian(gy,gm,gd);
  }
  function tryFillHijri(){
    if(groupIncomplete(fHy,fHm,fHd)){
      const stillHasOthers = fJy.value || fGy.value;
      if(stillHasOthers){ clearAll(); }
      return;
    }
    const hy=parseInt(fHy.value), hm=parseInt(fHm.value), hd=parseInt(fHd.value);
    if(hy && hm>=1 && hm<=12 && hd>=1 && hd<=30) fillFromHijri(hy,hm,hd);
  }
  [fJy,fJm,fJd].forEach(el=> el.addEventListener('input', tryFillJalali));
  [fJm].forEach(el=> el.addEventListener('change', tryFillJalali));
  [fGy,fGm,fGd].forEach(el=> el.addEventListener('input', tryFillGregorian));
  [fGm].forEach(el=> el.addEventListener('change', tryFillGregorian));
  [fHy,fHm,fHd].forEach(el=> el.addEventListener('input', tryFillHijri));
  [fHm].forEach(el=> el.addEventListener('change', tryFillHijri));

  document.getElementById('convTodayBtn').addEventListener('click', ()=>{
    fJy.value=tJy; fJm.value=tJm; fJd.value=tJd;
    fillFromJalali(tJy,tJm,tJd);
  });
  document.getElementById('convClearBtn').addEventListener('click', clearAll);
}


/* ---------- Settings button + save-on-close ---------- */
document.getElementById('settingsBtn').addEventListener('click', ()=>{
  if(window.__saveCurrentDayNote) window.__saveCurrentDayNote();
  openSettingsModal();
});
window.addEventListener('pagehide', ()=>{
  if(window.__saveCurrentDayNote) window.__saveCurrentDayNote();
});
window.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden' && window.__saveCurrentDayNote) window.__saveCurrentDayNote();
});

/* ---------- Init ---------- */
document.getElementById('reminderPopupCloseBtn').addEventListener('click', closeReminderPopup);
document.getElementById('reminderPopupOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'reminderPopupOverlay') closeReminderPopup();
});
(async function init(){
  initTheme();
  initPalette();
  applyPlannerIdentity();
  await loadTasks();
  await renderAll();
  setTimeout(maybeShowReminderPopup, 600);
})();
</script>
</body>
